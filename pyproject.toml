[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "accordionq2"
dynamic = ["version"]
description = "Python client for the AccordionQ2 Hardware Management REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
authors = [{name = "eSharp AB"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/esharpab/esharp-accordion-projects-webapiclient-python"
Documentation = "https://esharp-accordion-projects-webapiclient-python.readthedocs.io/en/latest/"
PyPI = "https://pypi.org/project/accordionq2/"
"NuGet (.NET)" = "https://www.nuget.org/packages/AccordionQ2.WebApiClient/"

[project.optional-dependencies]
docs = ["mkdocs-material>=9.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4",
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["accordionq2*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not performance'"
markers = [
    "integration: marks tests as integration tests (require hardware)",
    "performance: marks throughput/latency benchmarks (require hardware)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific (includes RUF012 – mutable class vars)
    "ANN",  # flake8-annotations (type hint enforcement)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # no annotation enforcement in tests

[tool.mypy]
python_version = "3.11"
strict = true
files = ["accordionq2"]
